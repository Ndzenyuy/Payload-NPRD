name: Deploy Frontend to ECS

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: vars
        run: |
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            ENV="prod"
            ECR_REPO="testapp-frontend-prod"
            ECS_CLUSTER="ECS-Cluster-Shared-Services-PRD"
            ECS_SERVICE="testapp-frontend-prod"
            ALB_NAME="ALB-testapp-PRD"
          else
            TAG="${COMMIT_SHA}-nonprod-${TIMESTAMP}"
            ENV="nonprod"
            ECR_REPO="testapp-frontend-nonprod"
            ECS_CLUSTER="ECS-Cluster-Shared-Services-NPRD"
            ECS_SERVICE="testapp-frontend-nonprod"
            ALB_NAME="ALB-testapp-NPRD"
          fi

          echo "tag=${TAG}"               >> $GITHUB_OUTPUT
          echo "env=${ENV}"               >> $GITHUB_OUTPUT
          echo "ecr_repo=${ECR_REPO}"     >> $GITHUB_OUTPUT
          echo "ecs_cluster=${ECS_CLUSTER}" >> $GITHUB_OUTPUT
          echo "ecs_service=${ECS_SERVICE}" >> $GITHUB_OUTPUT
          echo "alb_name=${ALB_NAME}"     >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve ALB DNS name
        id: alb
        run: |
          # Fetch the ALB DNS name so it can be baked into the Next.js bundle.
          # NEXT_PUBLIC_PAYLOAD_URL is a build-time constant — it cannot be changed at runtime.
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ steps.vars.outputs.alb_name }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "ERROR: Could not resolve ALB DNS for ${{ steps.vars.outputs.alb_name }}"
            echo "Ensure Terraform app layer is deployed before running this workflow."
            exit 1
          fi

          echo "alb_dns=${ALB_DNS}" >> $GITHUB_OUTPUT
          echo "Resolved ALB: $ALB_DNS"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
          ECR_REPO: ${{ steps.vars.outputs.ecr_repo }}
          # NEXT_PUBLIC_PAYLOAD_URL points to the backend API path on the ALB.
          # The frontend fetches Payload content from /api/* which the ALB routes to the backend.
          NEXT_PUBLIC_PAYLOAD_URL: "http://${{ steps.alb.outputs.alb_dns }}/api"
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_PAYLOAD_URL="$NEXT_PUBLIC_PAYLOAD_URL" \
            -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy updated service
        run: |
          CURRENT_DEF=$(aws ecs describe-task-definition \
            --task-definition ${{ steps.vars.outputs.ecs_service }} \
            --query 'taskDefinition' --output json)

          NEW_DEF=$(echo "$CURRENT_DEF" | jq \
            --arg IMAGE "${{ steps.build.outputs.image }}" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          aws ecs update-service \
            --cluster ${{ steps.vars.outputs.ecs_cluster }} \
            --service ${{ steps.vars.outputs.ecs_service }} \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment

          echo "Service deployment initiated: ${{ steps.vars.outputs.ecs_service }}"

      - name: Summary
        if: always()
        run: |
          echo "Environment          : ${{ steps.vars.outputs.env }}"
          echo "Image tag            : ${{ steps.vars.outputs.tag }}"
          echo "ALB DNS              : ${{ steps.alb.outputs.alb_dns }}"
          echo "NEXT_PUBLIC_PAYLOAD_URL : http://${{ steps.alb.outputs.alb_dns }}/api"
          echo "ECS cluster          : ${{ steps.vars.outputs.ecs_cluster }}"
          echo "ECS service          : ${{ steps.vars.outputs.ecs_service }}"
          echo "Status               : ${{ job.status }}"
