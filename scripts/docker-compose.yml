# Run from repo root: ./scripts/up.sh
# Populate scripts/.env first by running: ./scripts/fetch-ssm-env.sh
# No local postgres container — DATABASE_URI points to the shared RDS instance via SSM.
services:
  migrate:
    build:
      context: ..
      dockerfile: scripts/backend-migrate.Dockerfile
    env_file:
      - .env
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    networks:
      - app
    profiles:
      - tools

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PAYLOAD_URL: ${PAYLOAD_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    ports:
      - "3001:3001"
    volumes:
      - backend_media:/app/media
    user: "0"
    command: ["sh", "-c", "mkdir -p /app/media && chown 1001:1001 /app/media && exec su -s /bin/sh nextjs -c 'node server.js'"]
    networks:
      - app

  frontend:
    build:
      context: ..
      dockerfile: scripts/frontend.Dockerfile
      args:
        NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL:-http://localhost:3001}
    environment:
      # Server-side API calls from container use backend hostname; browser uses NEXT_PUBLIC_PAYLOAD_URL
      PAYLOAD_API_URL: ${PAYLOAD_API_URL:-http://backend:3001}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app

volumes:
  backend_media:

networks:
  app:
    driver: bridge
